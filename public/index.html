<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Terminal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232962ff'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" title="Quant Terminal">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <rect width="32" height="32" rx="7" fill="var(--accent)" />
          <path
            d="M7 21l6-7 5 4 7-9"
            stroke="#fff"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <button
        id="symbolBtn"
        class="tb symbol-btn"
        title="Change symbol (or just start typing)"
      >
        <span id="symbolLabel">BTCUSDT</span>
      </button>
      <div class="sep"></div>
      <div id="tfButtons" class="tf-group"></div>
      <input
        id="tfCustom"
        class="tf-custom"
        placeholder="7m"
        title="Any timeframe: 1s, 7m, 2h, 3D, 2W, 3M"
        size="4"
      />
      <div class="sep"></div>
      <select id="chartType" class="tb" title="Chart type"></select>
      <button id="indicatorsBtn" class="tb" title="Indicators">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 3" /></svg
        ><span>Indicators</span>
      </button>
      <button id="compareBtn" class="tb" title="Compare symbols">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 6v12M6 12h12" /></svg
        ><span>Compare</span>
      </button>
      <div class="sep"></div>
      <select id="layoutSel" class="tb" title="Chart layout">
        <option value="1">1 chart</option>
        <option value="2v">2 side by side</option>
        <option value="2h">2 stacked</option>
        <option value="3">3 charts</option>
        <option value="4">4 charts</option>
        <option value="6">6 charts</option>
        <option value="8">8 charts</option>
        <option value="16">16 charts</option>
      </select>
      <label class="tb check" title="Change the symbol on every chart at once"
        ><input type="checkbox" id="syncSymbol" /> Sync</label
      >
      <button id="replayBtn" class="tb" title="Bar replay">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" /></svg
        ><span>Replay</span>
      </button>
      <button id="alertBtn" class="tb" title="Create alert">
        <svg viewBox="0 0 24 24">
          <path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20h4" /></svg
        ><span>Alert</span>
      </button>
      <div class="spacer"></div>
      <a
        class="tb"
        href="https://github.com/theAfricanQuant/quant-terminal#readme"
        target="_blank"
        rel="noopener"
        title="Setup and usage guide"
        >Help</a
      >
      <button id="logBtn" class="tb" title="Logarithmic price scale">
        Log
      </button>
      <button id="snapBtn" class="tb icon" title="Download chart image">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="14" rx="2" />
          <circle cx="12" cy="13" r="3.5" />
          <path d="M8 6l2-3h4l2 3" />
        </svg>
      </button>
      <button id="csvBtn" class="tb icon" title="Export chart data (CSV)">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v11M7 10l5 5 5-5M5 20h14" />
        </svg>
      </button>
      <button id="settingsBtn" class="tb icon" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="themeBtn" class="tb icon" title="Light / dark">
        <svg viewBox="0 0 24 24">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </svg>
      </button>
      <span id="status" class="status" title="Data status"></span>
    </header>

  <div class="main">
      <nav class="drawbar" id="drawbar"></nav>
      <section class="center">
        <div id="grid" class="grid"></div>
        <div id="bottom" class="bottom collapsed">
          <div class="tabs" id="bottomTabs">
            <button data-tab="tester" class="active">Strategy tester</button>
            <button data-tab="screener">Screener</button>
            <button data-tab="heatmap">Heatmap</button>
            <button data-tab="seasonals">Seasonals</button>
            <button data-tab="financials">Financials</button>
            <button data-tab="paper">Paper trading</button>
            <button data-tab="editor">Indicator editor</button>
          <button data-tab="ptq">PTQ</button>
            <div class="spacer"></div>
            <button id="bottomToggle" class="icon" title="Show / hide panel">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg>
            </button>
          </div>
          <div class="tab-body" id="bottomBody"></div>
        </div>
      </section>
      <aside class="side">
        <div class="tabs" id="sideTabs">
          <button data-tab="watchlist" class="active">Watchlist</button>
          <button data-tab="alerts">Alerts</button>
          <button data-tab="calendar">Calendar</button>
          <button data-tab="news">News</button>
        </div>
        <div class="tab-body" id="sideBody"></div>
      </aside>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>
    <div id="toasts" class="toasts"></div>

    <script>window.QUANT_TERMINAL_PUBLIC_DEMO = false;</script>
    <script src="/vendor/lightweight-charts.standalone.production.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
